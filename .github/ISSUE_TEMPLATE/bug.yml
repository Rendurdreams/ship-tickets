name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Ship Tickets. Do not disclose vulnerabilities here; use private vulnerability reporting.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment mode, browser/device, Node version, and relevant provider modes. Never paste secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, tokens, personal data, and event/customer information.
  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This is not a security vulnerability or private data exposure.
          required: true
